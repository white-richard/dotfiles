set -g default-terminal "screen-256color" # Set terminal type for 256-color
set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-color

set -g set-clipboard on # Use system clipboard
set -g detach-on-destroy on # Exit tmux when closing a session
set -g escape-time 0 # Remove delay for exiting insert mode with
set -g history-limit 1000000 # Increase history size (default: 2,000)
set -g mouse on # Enable mouse support
set -g status-interval 3 # Update the status bar every 3 seconds
set -g visual-activity off
set -g focus-events on
set -g allow-passthrough on # Allow programs in the pane to bypass tmux (e.g. image preview)
set -g extended-keys always # Enable modern key pass-through
bind-key -T root S-Enter send-keys Escape "[13;2u" # Allows shift+enter in Ghostty
# Attempt for Zed
# set -as terminal-features 'xterm*:extkeys'
# bind-key -n S-Enter send-keys Escape "[13;2u"

# =========================================================
# Toggle prefix between local and remote using F12
# =========================================================
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  refresh-client -S
# =========================================================

# Set prefix key
# unbind C-b # Unbind default prefix key
# set -g prefix C-space # Set new prefix to Ctrl+Space

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Split horizontally in CWD with '\'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
# Split vertically in CWD with '-'
unbind \"
bind - split-window -c "#{pane_current_path}"

# New window in same path to 'c'
bind c new-window -c "#{pane_current_path}"

# Use vim arrow key to resize (inside vim, but not terminal)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Smart pane switching with awareness of Vim
bind -n C-h if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq vim' \
 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq vim' \
 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq vim' \
 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq vim' \
 'send-keys C-l' 'select-pane -R'

# Use m key to maximize pane
bind -r m resize-pane -Z

# Enable vi mode to allow us to use vim keys to move around in copy mode
# (Predix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start selecting text with 'v'
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Copy text with 'y' (reaches the system clipboard via OSC 52)
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Don't exit copy mode when dragging with mouse, but do copy the text
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

# Copy to the system clipboard via OSC 52 (works locally and over SSH)
set -as terminal-features ',*:clipboard'

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# tpm plugin manager
set -g @plugin "tmux-plugins/tpm"

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'tmux-plugins/tmux-resurrect' # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # Automatically saves sessions every 15 minutes
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info

# Install tpm and any missing plugins (must come after the @plugin list)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${HOME}/.config/tmux/plugins/"
run 'T=~/.config/tmux/plugins/tpm; [ -d "$T" ] || git clone -q https://github.com/tmux-plugins/tpm "$T"; "$T/bin/install_plugins" >/dev/null 2>&1 || true'

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
orange="#D08770"

set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "fg=${gray_medium},bg=default"

# Session name: green, orange while prefix is held, OFF badge in F12 mode
set -g status-left "#{?#{==:#{client_key_table},off},#[fg=${gray_dark}#,bg=${orange}#,bold] OFF #[default],}#{?client_prefix,#[fg=${orange}],#[fg=${green_soft}]}#[bold] #S #[default] "

set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#[fg=${cyan_soft},bold] #I #W#{?window_zoomed_flag, [Z],} "

set -g status-right "#[fg=${blue_muted}]#(cd #{pane_current_path}; git branch --show-current 2>/dev/null) #[fg=${gray_medium}]#{b:pane_current_path}  cpu #{cpu}  mem #{mem}  %H:%M "

set -g message-style "fg=${gray_light}, bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

# Resurrect
set -g @resurrect-capture-pane-contents 'on'  # Cache pane contents every 15 minutes
# set -g @continuum-restore 'on'  # Auto restore cached tmux sessions
# Cached to $HOME/.local/share/tmux/resurrect
set -g @continuum-boot 'on'  # Start tmux server in background on boot

# Build cpu-mem-monitor's venv with uv (rebuilds if missing or broken); the plugin then skips its own setup
run 'P=~/.config/tmux/plugins/tmux-cpu-mem-monitor; PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"; \
  [ -d "$P" ] && ! "$P/venv/bin/python" -c "import psutil" 2>/dev/null && \
  rm -rf "$P/venv" && uv venv -q "$P/venv" && uv pip install -q -p "$P/venv" -r "$P/requirements.txt" || true'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
