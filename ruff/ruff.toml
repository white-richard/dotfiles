# ruff.toml

line-length = 100

[lint]
fixable = ["ALL"]
# Likely bugs, not style; a project's own [tool.ruff] replaces this.
select = [
    "F",    # pyflakes: undefined names, unused imports and variables
    "B",    # bugbear: late-binding closures, mutable defaults, zip without strict
    "E9",   # syntax and IO errors
    "E71",  # comparison to None/True, not in, is not
    "E72",  # type() comparison, bare except
    "PLE",  # pylint errors
    "I",    # import sorting (auto-fixed)
]


[format]
quote-style = "double"
skip-magic-trailing-comma = false
